<!DOCTYPE html>
<meta charset="utf-8" />
<title>Tekken Overlay</title>
<body>
  <main id="scoreboard">
    <section class="player player-one">
      <div class="score" id="p1score">0</div>
      <div class="name" id="p1name"></div>
    </section>
    <section class="meta">
      <div class="event" id="description"></div>
      <div class="subtitle" id="subtitle"></div>
    </section>
    <section class="player player-two">
      <div class="name" id="p2name"></div>
      <div class="score" id="p2score">0</div>
    </section>
  </main>
</body>
<link href="index.css" rel="stylesheet" />
<script src="index.js"></script>
