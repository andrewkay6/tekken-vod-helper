<!DOCTYPE html>
<meta charset="utf-8" />
<title>Tekken Overlay</title>
<style>
  html,
  body,
  #scoreboard {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
  }
</style>
<link href="index.css" rel="stylesheet" />
<body>
  <main id="scoreboard">
    <div id="plate-host" class="scoreboard-plate"></div>

    <div id="description"></div>
    <div id="subtitle"></div>

    <div id="p1score">0</div>
    <div id="p1name"></div>

    <div id="p2score">0</div>
    <div id="p2name"></div>
  </main>
  <script src="index.js"></script>
</body>
